# nsjail config for Java code execution sandbox
# Usage: nsjail -C nsjail-java.cfg -T /path/to/workspace -- /path/to/java javac Main.java
#
# Note: When running inside Docker, user namespaces should be disabled
# because Docker already provides container isolation.

# Mode: execute once per invocation
mode: ONCE

# Hostname inside sandbox
hostname: "java-jail"

# Working directory (passed via -T flag at runtime)
cwd: "/workspace"

# Execution time limit (seconds) - enforced by nsjail
time_limit: 120

# CPU limit (cores)
max_cpus: 1

# Resource limits
rlimit_as: 512
rlimit_cpu: 60
rlimit_nofile: 64
rlimit_nproc: 16
rlimit_stack: 256

# Namespace isolation - no network, isolated processes/files/users
# Note: clone_newuser disabled when running inside Docker (Docker handles it)
clone_newnet: true
clone_newuser: false
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

# Disable privilege dropping (container already runs as non-root)
disable_no_new_privs: true
keep_caps: false

# Seccomp policy - allow syscalls needed by JVM, deny everything else
# This is a permissive policy for Java - for stricter security, use a minimal policy
seccomp_string: 'ALLOW { read, write, open, close, execve, brk, mmap, munmap, mremap, arch_prctl, access, pipe, pipe2, dup, dup2, dup3, getpid, getppid, getuid, geteuid, getgid, getegid, getcwd, getrandom, ioctl, readlink, getdents, getdents64, lseek, fstat, fstatfs, madvise, mprotect, msync, mlock, mlock2, mlockall, rt_sigaction, rt_sigreturn, sigaltstack, futex, set_robust_list, get_robust_list, epoll_create, epoll_create1, epoll_ctl, epoll_wait, epoll_pwait, timer_create, timer_settime, timer_delete, clock_gettime, clock_getres, clock_gettime64, clock_getres64, exit, exit_group, wait4, waitid, kill, tkill, tgkill, nanosleep, clock_nanosleep, sched_setaffinity, sched_getaffinity, prlimit64, sysinfo, personality, getpriority, setpriority, prctl, capget, capset, seccomp, gettid, syslog, vfork, fork, clone, clone3, unshare, setns, getcpu, statx, io_setup, io_submit, io_cancel, io_destroy, inotify_init, inotify_add_watch, inotify_rm_watch, eventfd2, signalfd, eventfd, signalfd4, socket, bind, connect, listen, accept, accept4, getsockname, getpeername, socketpair, sendto, recvfrom, sendmsg, recvmsg, shutdown, setsockopt, getsockopt, sendmmsg, recvmmsg, statfs, fstatfs, chdir, fchdir, chmod, fchmod, link, unlink, rename, mkdir, rmdir, symlink, readlink, chmod, utime, getgroups, setgroups, setresuid, getresuid, setresgid, getresgid, poll, select, splice, tee, vmsplice, perf_event_open, process_vm_readv, process_vm_writev } DEFAULT KILL'

# Environment variables
keep_env: false
envar: "JAVA_HOME=/usr/lib/jvm/java-11-openjdk"
envar: "PATH=/usr/lib/jvm/java-11-openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
envar: "MALLOC_ARENA_MAX=4"
envar: "_JAVA_OPTIONS=-Xmx128m -Xms16m -XX:-UsePerfData"
