# nsjail config for Java code execution sandbox
# Usage: nsjail -C nsjail-java.cfg -B /path/to/workspace:/workspace -- javac Main.java
#
# Note: When running inside Docker, set NSJAIL_DISABLE_NEWNS=true to disable
# mount namespace (clone_newns), since Docker already provides container isolation.

# Mode: execute once per invocation
mode: ONCE

# Silence nsjail's own log noise; only show warnings/errors.
# This keeps stderr clean so the user's compile/runtime output is easy to read.
log_level: WARNING

# Hostname inside sandbox
hostname: "java-jail"

# Working directory is overridden at runtime via `nsjail -D <workspace>`
# cwd: "/workspace"

# Execution time limit (seconds)
time_limit: 120

# CPU limit (cores)
max_cpus: 1

# Resource limits
rlimit_as: 2048
rlimit_cpu: 60
rlimit_nofile: 64
rlimit_nproc: 16
rlimit_stack: 256

# Namespace isolation - clone_newns is disabled in Docker
clone_newnet: true
clone_newuser: false
clone_newns: false
clone_newpid: true
clone_newipc: true
clone_newuts: true

# Disable privilege dropping
disable_no_new_privs: true
keep_caps: false

# Security is provided by Docker container isolation + nsjail namespaces
# Seccomp disabled on Arch/CachyOS (libseccomp doesn't recognize fstat syscall name)

# Environment variables
keep_env: false
envar: "JAVA_HOME=/usr/lib/jvm/java-11-openjdk"
envar: "PATH=/usr/lib/jvm/java-11-openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
envar: "MALLOC_ARENA_MAX=4"
# NOTE: We intentionally do NOT set _JAVA_OPTIONS / JDK_JAVA_OPTIONS here.
# OpenJDK prints "Picked up _JAVA_OPTIONS: ..." to stderr whenever it sees
# that env var, which would pollute the student's compile output. JVM memory
# flags are passed directly via argv by nsjailExecutor.js instead.
