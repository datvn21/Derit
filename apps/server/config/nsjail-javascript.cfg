# nsjail config for JavaScript (Node.js) code execution sandbox.
# Usage: nsjail -C nsjail-javascript.cfg -B /path/to/workspace:/workspace -- node main.js
#
# Note: When running inside Docker, set NSJAIL_DISABLE_NEWNS=true to disable
# mount namespace (clone_newns), since Docker already provides container isolation.

mode: ONCE
hostname: "js-jail"
cwd: "/workspace"

time_limit: 30
max_cpus: 1

rlimit_as: 384
rlimit_cpu: 15
rlimit_nofile: 64
rlimit_nproc: 8
rlimit_stack: 8

# clone_newns is disabled in Docker
clone_newnet: true
clone_newuser: false
clone_newns: false
clone_newpid: true
clone_newipc: true
clone_newuts: true

disable_no_new_privs: true
keep_caps: false

# Security is provided by Docker container isolation + nsjail namespaces
# Seccomp disabled on Arch/CachyOS (libseccomp doesn't recognize fstat syscall name)

keep_env: false
envar: "NODE_OPTIONS=--no-deprecation --no-warnings"
envar: "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
