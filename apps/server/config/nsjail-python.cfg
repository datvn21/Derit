# nsjail config for Python code execution sandbox
# Usage: nsjail -C nsjail-python.cfg -B /path/to/workspace:/workspace -- python3 script.py
#
# Note: When running inside Docker, set NSJAIL_DISABLE_NEWNS=true to disable
# mount namespace (clone_newns), since Docker already provides container isolation.

# Mode: execute once per invocation
mode: ONCE

# Hostname inside sandbox
hostname: "python-jail"

# Working directory
cwd: "/workspace"

# Execution time limit (seconds) - enforced by nsjail
time_limit: 60

# CPU limit (cores)
max_cpus: 1

# Resource limits
rlimit_as: 512
rlimit_cpu: 30
rlimit_nofile: 64
rlimit_nproc: 16
rlimit_stack: 8

# Namespace isolation - clone_newns is disabled in Docker (NSJAIL_DISABLE_NEWNS=true)
clone_newnet: true
clone_newuser: false
clone_newns: false
clone_newpid: true
clone_newipc: true
clone_newuts: true

# Disable privilege dropping
disable_no_new_privs: true
keep_caps: false

# Security is provided by Docker container isolation + nsjail namespaces
# Seccomp disabled on Arch/CachyOS (libseccomp doesn't recognize fstat syscall name)

# Environment variables
keep_env: false
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONUNBUFFERED=1"
envar: "PATH=/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
