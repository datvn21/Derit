# nsjail config for Python code execution sandbox
# Usage: nsjail -C nsjail-python.cfg -T /path/to/workspace -- python3 script.py
#
# Note: When running inside Docker, user namespaces should be disabled
# because Docker already provides container isolation.

# Mode: execute once per invocation
mode: ONCE

# Hostname inside sandbox
hostname: "python-jail"

# Working directory (passed via -T flag at runtime)
cwd: "/workspace"

# Execution time limit (seconds) - enforced by nsjail
time_limit: 60

# CPU limit (cores)
max_cpus: 1

# Resource limits
rlimit_as: 512
rlimit_cpu: 30
rlimit_nofile: 64
rlimit_nproc: 16
rlimit_stack: 8

# Namespace isolation - no network, isolated processes/files/users
# Note: clone_newuser disabled when running inside Docker (Docker handles it)
clone_newnet: true
clone_newuser: false
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

# Disable privilege dropping (container already runs as non-root)
disable_no_new_privs: true
keep_caps: false

# Seccomp policy - allow syscalls needed by Python interpreter
seccomp_string: 'ALLOW { read, write, open, close, execve, brk, mmap, munmap, arch_prctl, access, pipe, dup, dup2, getpid, getppid, getuid, geteuid, getgid, getegid, getcwd, getrandom, ioctl, readlink, getdents, lseek, fstat, madvise, mprotect, msync, mlock, rt_sigaction, rt_sigreturn, sigaltstack, futex, set_robust_list, get_robust_list, epoll_create, epoll_ctl, epoll_wait, timer_create, timer_settime, clock_gettime, clock_getres, exit, exit_group, wait4, kill, tkill, tgkill, nanosleep, clock_nanosleep, sched_setaffinity, sched_getaffinity, prlimit64, sysinfo, personality, getpriority, setpriority, prctl, capget, capset, seccomp, gettid, vfork, fork, clone, unshare, setns, getcpu, statx, eventfd2, signalfd, eventfd, signalfd4, inotify_init, inotify_add_watch, inotify_rm_watch, getrandom } DEFAULT KILL'

# Environment variables
keep_env: false
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONUNBUFFERED=1"
envar: "PATH=/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
