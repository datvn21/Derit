# nsjail config for C++ code execution sandbox.
# Usage: nsjail -C nsjail-cpp.cfg -B /path/to/workspace:/workspace -- ./main
#
# Note: When running inside Docker, set NSJAIL_DISABLE_NEWNS=true to disable
# mount namespace (clone_newns), since Docker already provides container isolation.

mode: ONCE
log_level: WARNING
hostname: "cpp-jail"
# Working directory is overridden at runtime via `nsjail -D <workspace>`
# cwd: "/workspace"

time_limit: 60
max_cpus: 1

rlimit_as: 512
rlimit_cpu: 30
rlimit_nofile: 64
rlimit_nproc: 16
rlimit_stack: 8

# clone_newns is disabled in Docker
clone_newnet: true
clone_newuser: false
clone_newns: false
clone_newpid: true
clone_newipc: true
clone_newuts: true

disable_no_new_privs: true
keep_caps: false

# Security is provided by Docker container isolation + nsjail namespaces
# Seccomp disabled on Arch/CachyOS (libseccomp doesn't recognize fstat syscall name)

keep_env: false
envar: "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
