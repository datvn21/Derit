# nsjail config for C++ code execution sandbox.
#
# Usage: nsjail -C nsjail-cpp.cfg -T /path/to/workspace -- ./main
#
# Note: when running inside Docker, user namespaces are disabled because
# Docker already provides container isolation.

mode: ONCE
hostname: "cpp-jail"
cwd: "/workspace"

time_limit: 60
max_cpus: 1

rlimit_as: 512
rlimit_cpu: 30
rlimit_nofile: 64
rlimit_nproc: 16
rlimit_stack: 8

clone_newnet: true
clone_newuser: false
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

disable_no_new_privs: true
keep_caps: false

# Strict POSIX-ish syscall set used for compiled binaries.
seccomp_string: 'ALLOW { read, write, open, close, execve, brk, mmap, munmap, mremap, arch_prctl, access, pipe, pipe2, dup, dup2, dup3, getpid, getppid, getuid, geteuid, getgid, getegid, getcwd, getrandom, ioctl, readlink, getdents, getdents64, lseek, fstat, fstatfs, madvise, mprotect, msync, mlock, mlock2, mlockall, rt_sigaction, rt_sigreturn, sigaltstack, futex, set_robust_list, get_robust_list, epoll_create, epoll_create1, epoll_ctl, epoll_wait, epoll_pwait, timer_create, timer_settime, timer_delete, clock_gettime, clock_getres, clock_gettime64, clock_getres64, exit, exit_group, wait4, waitid, kill, tkill, tgkill, nanosleep, clock_nanosleep, sched_setaffinity, sched_getaffinity, prlimit64, sysinfo, personality, getpriority, setpriority, prctl, capget, capset, seccomp, gettid, getresuid, getresgid, setresuid, setresgid, uname, getrlimit, setrlimit, getrusage, times } DEFAULT KILL'

keep_env: false
envar: "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
