services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_prod_data:/data/db
    mem_limit: 768m
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: derit-server:latest
    expose:
      - "3000"
    env_file:
      - path: ./apps/server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_CONNECTIONSTRING: mongodb://mongodb:27017/derit
      FRONTEND_URL: http://localhost
      NSJAIL_PATH: /usr/bin/nsjail
      NSJAIL_CONFIG_DIR: /app/config
      NSJAIL_WORKSPACE_DIR: /tmp/nsjail-workspace
      NSJAIL_DISABLE_NEWNS: "true"
      NSJAIL_MAX_CONCURRENT: 5
      NSJAIL_MEMORY_LIMIT_MB: 256
      RUN_TIMEOUT: 3000
      COMPILE_TIMEOUT: 15000
    restart: unless-stopped
    mem_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "1.8"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1.25G
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: /api
    image: derit-web:latest
    ports:
      - "80:80"
    restart: unless-stopped
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongodb_prod_data:

networks:
  default:
    name: derit-prod-network
